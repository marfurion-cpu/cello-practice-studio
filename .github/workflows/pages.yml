name: Validate and deploy cello practice site
on:
  push:
    branches: [main, maintenance/release-guard]
    paths: ['site*.zip', 'release.json', 'scripts/**', '.github/workflows/pages.yml']
  pull_request:
    paths: ['site*.zip', 'release.json', 'scripts/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate exact release archive
        run: python3 scripts/validate_site.py
      - name: Test validation rejection cases
        run: python3 scripts/test_validate_site.py
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate and unpack the only archive
        run: |
          python3 scripts/validate_site.py
          mkdir -p _site
          unzip -q site.zip -d _site
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
